{% extends "base.html" %}

{% block body %}
<div class="welcome-screen">
    <div class="card welcome-card">
        <div class="icon">&#128161;</div>
        <h2>Improve Your Suggestions</h2>
        <p>
            Answer {{ total }} more question{{ 's' if total != 1 }} to help
            me suggest even better gifts.<br><br>
            You can stop anytime and come back later.
        </p>
        <a href="{{ url_for('bonus_question', index=0) }}" class="btn btn-primary btn-lg">Let's Go</a>
        <div class="mt-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
