{% extends "base.html" %}

{% block body %}
<!-- Header -->
<div class="header">
    <div class="container">
        <h1>&#127873; {{ occasion.occasion_label }}</h1>
        <div class="header-actions">
            <a href="{{ url_for('timeline') }}" class="btn btn-ghost btn-sm">&#8592; Timeline</a>
        </div>
    </div>
</div>

<div class="container py-4">
    <div class="select-occasion-info">
        <span class="text-secondary">{{ occasion.occasion_date }}</span>
    </div>

    <!-- Swipe Card Deck -->
    <div id="card-deck" class="swipe-deck">
        <div class="swipe-deck-inner" id="deck-inner"></div>
        <div class="swipe-stamp swipe-stamp-skip" id="stamp-skip">SKIP</div>
        <div class="swipe-stamp swipe-stamp-pick" id="stamp-pick">PICK</div>

        <div class="swipe-empty" id="deck-empty" style="display:none">
            <div class="swipe-empty-icon">&#128260;</div>
            <h3>Want more ideas?</h3>
            <p>Load a fresh batch of personalized suggestions.</p>
            <button class="btn btn-primary mt-2" id="btn-load-more">Load More Ideas</button>
            <a href="{{ url_for('timeline') }}" class="btn btn-ghost mt-2">&#8592; Back to Timeline</a>
        </div>

        <!-- Selection confirmation overlay -->
        <div class="swipe-celebration" id="celebration" style="display:none">
            <div class="celebration-icon">&#127873;</div>
            <div class="celebration-text">Gift Selected!</div>
            <div class="celebration-links" id="celebration-links"></div>
            <button class="btn btn-primary mt-2" id="celebration-confirm">Confirm &amp; Return to Timeline</button>
            <button class="btn-continue" id="celebration-continue">See More Cards &#8594;</button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="swipe-actions" id="swipe-actions">
        <button class="swipe-btn swipe-btn-skip" id="btn-skip" aria-label="Skip">&#10060;</button>
        <div class="swipe-counter" id="card-counter">1 of 8</div>
        <button class="swipe-btn swipe-btn-pick" id="btn-pick" aria-label="Select">&#10084;&#65039;</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var CARDS = {{ card_deck_json|safe }};
    var OCC_ID = {{ occasion.id }};
    var currentIndex = 0;
    var selectedGift = null;
    var selectedLink = '';

    var deckInner = document.getElementById('deck-inner');
    var deckEmpty = document.getElementById('deck-empty');
    var celebration = document.getElementById('celebration');
    var celebrationLinks = document.getElementById('celebration-links');
    var celebrationConfirm = document.getElementById('celebration-confirm');
    var celebrationContinue = document.getElementById('celebration-continue');
    var counter = document.getElementById('card-counter');
    var actions = document.getElementById('swipe-actions');
    var stampSkip = document.getElementById('stamp-skip');
    var stampPick = document.getElementById('stamp-pick');
    var btnSkip = document.getElementById('btn-skip');
    var btnPick = document.getElementById('btn-pick');

    var startX = 0, startY = 0, currentX = 0, dragging = false, cardEl = null;
    var THRESHOLD = 80;

    function escHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function buildLinksHtml(gift) {
        if (gift.kind === 'product') {
            return '<a class="btn-buy-now" href="' + escHtml(gift.top_pick_url) + '" target="_blank" rel="noopener">' +
                       '\uD83C\uDF1F Top Pick: ' + escHtml(gift.top_pick_name) + '</a>' +
                   '<a class="btn-browse" href="' + escHtml(gift.browse_url) + '" target="_blank" rel="noopener">' +
                       '\uD83D\uDD0D See All Options</a>';
        }
        return '<a class="btn-buy-now" href="' + escHtml(gift.venue_url) + '" target="_blank" rel="noopener">' +
                   escHtml(gift.venue_name) + ' \u2192</a>';
    }

    function buildCardLinksHtml(gift) {
        if (gift.kind === 'product') {
            return '<a class="swipe-card-buy" href="' + escHtml(gift.top_pick_url) + '" target="_blank" rel="noopener"' +
                       ' onclick="event.stopPropagation()">\uD83C\uDF1F ' + escHtml(gift.top_pick_name) + '</a>' +
                   '<a class="swipe-card-buy swipe-card-browse" href="' + escHtml(gift.browse_url) + '" target="_blank" rel="noopener"' +
                       ' onclick="event.stopPropagation()">\uD83D\uDD0D Browse</a>';
        }
        return '<a class="swipe-card-buy" href="' + escHtml(gift.venue_url) + '" target="_blank" rel="noopener"' +
                   ' onclick="event.stopPropagation()">' + escHtml(gift.venue_name) + ' \u2192</a>';
    }

    function getPrimaryLink(gift) {
        if (gift.kind === 'product') return gift.top_pick_url || gift.browse_url || '';
        return gift.venue_url || '';
    }

    function renderCard() {
        deckInner.innerHTML = '';
        stampSkip.style.opacity = '0';
        stampPick.style.opacity = '0';

        if (currentIndex >= CARDS.length) {
            deckEmpty.style.display = 'flex';
            actions.style.display = 'none';
            return;
        }

        var gift = CARDS[currentIndex];
        var effortLabel = gift.effort <= 1 ? '\u26A1 Easy' : '\uD83D\uDC4D Moderate';
        var typeLabel = gift.gift_type === 'quarterly' ? 'Quarterly Surprise' : 'Monthly';
        var tagStr = escHtml((gift.tags || []).join(' \u2022 '));
        var priceHtml = gift.price
            ? '<div class="swipe-card-price">\uD83D\uDCB0 ' + escHtml(gift.price) + '</div>'
            : '';

        var card = document.createElement('div');
        card.className = 'swipe-card';
        card.innerHTML =
            '<div class="swipe-card-type">' + escHtml(typeLabel) + '</div>' +
            '<div class="swipe-card-name">' + escHtml(gift.name) + '</div>' +
            priceHtml +
            '<div class="swipe-card-tags">' + tagStr + '</div>' +
            '<div class="swipe-card-meta">' +
                '<span class="swipe-card-effort">' + effortLabel + '</span>' +
            '</div>' +
            '<div class="swipe-card-links">' + buildCardLinksHtml(gift) + '</div>';

        deckInner.appendChild(card);
        cardEl = card;
        counter.textContent = (currentIndex + 1) + ' of ' + CARDS.length;

        card.addEventListener('touchstart', onTouchStart, {passive: true});
        card.addEventListener('touchmove', onTouchMove, {passive: false});
        card.addEventListener('touchend', onTouchEnd);
        card.addEventListener('mousedown', onMouseDown);
    }

    function animateOut(direction, callback) {
        if (!cardEl) return callback && callback();
        var xTarget = direction === 'left' ? -400 : 400;
        var rotate = direction === 'left' ? -20 : 20;
        cardEl.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
        cardEl.style.transform = 'translateX(' + xTarget + 'px) rotate(' + rotate + 'deg)';
        cardEl.style.opacity = '0';
        setTimeout(function() { callback && callback(); }, 350);
    }

    function doSkip() {
        if (currentIndex < CARDS.length) {
            var gift = CARDS[currentIndex];
            fetch('/api/log-interaction', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: gift.name, action: 'skipped', gift_type: gift.gift_type})
            });
        }
        animateOut('left', function() {
            currentIndex++;
            renderCard();
        });
    }

    function doPick() {
        var gift = CARDS[currentIndex];
        selectedGift = gift;
        selectedLink = getPrimaryLink(gift);

        animateOut('right', function() {
            celebrationLinks.innerHTML = buildLinksHtml(gift);
            celebration.style.display = 'flex';
        });
    }

    // Confirm selection: save to server and go back to timeline
    celebrationConfirm.addEventListener('click', function() {
        if (!selectedGift) return;
        fetch('/occasion/' + OCC_ID + '/confirm-gift', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: selectedGift.name, purchase_link: selectedLink})
        }).then(function() {
            window.location.href = '/timeline';
        });
    });

    // See more cards instead
    celebrationContinue.addEventListener('click', function() {
        celebration.style.display = 'none';
        selectedGift = null;
        currentIndex++;
        renderCard();
    });

    btnSkip.addEventListener('click', doSkip);
    btnPick.addEventListener('click', doPick);

    // Touch handlers
    function onTouchStart(e) {
        if (dragging) return;
        dragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = 0;
        cardEl.style.transition = 'none';
    }
    function onTouchMove(e) {
        if (!dragging) return;
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 20) return;
        e.preventDefault();
        currentX = dx;
        cardEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.08) + 'deg)';
        var progress = Math.min(Math.abs(dx) / THRESHOLD, 1);
        stampSkip.style.opacity = dx < -20 ? progress : '0';
        stampPick.style.opacity = dx > 20 ? progress : '0';
    }
    function onTouchEnd() {
        if (!dragging) return;
        dragging = false;
        if (currentX < -THRESHOLD) doSkip();
        else if (currentX > THRESHOLD) doPick();
        else {
            cardEl.style.transition = 'transform 0.25s ease';
            cardEl.style.transform = 'translateX(0) rotate(0)';
            stampSkip.style.opacity = '0';
            stampPick.style.opacity = '0';
        }
    }

    // Mouse drag
    function onMouseDown(e) {
        if (dragging) return;
        dragging = true;
        startX = e.clientX;
        currentX = 0;
        cardEl.style.transition = 'none';
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    }
    function onMouseMove(e) {
        if (!dragging) return;
        var dx = e.clientX - startX;
        currentX = dx;
        cardEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.08) + 'deg)';
        var progress = Math.min(Math.abs(dx) / THRESHOLD, 1);
        stampSkip.style.opacity = dx < -20 ? progress : '0';
        stampPick.style.opacity = dx > 20 ? progress : '0';
    }
    function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        if (!dragging) return;
        dragging = false;
        if (currentX < -THRESHOLD) doSkip();
        else if (currentX > THRESHOLD) doPick();
        else {
            cardEl.style.transition = 'transform 0.25s ease';
            cardEl.style.transform = 'translateX(0) rotate(0)';
            stampSkip.style.opacity = '0';
            stampPick.style.opacity = '0';
        }
    }

    // Keyboard
    document.addEventListener('keydown', function(e) {
        if (currentIndex >= CARDS.length) return;
        if (e.key === 'ArrowLeft') doSkip();
        else if (e.key === 'ArrowRight') doPick();
    });

    // Load more cards
    document.getElementById('btn-load-more').addEventListener('click', function() {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Loading...';

        fetch('/api/occasion/' + OCC_ID + '/more-cards', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.cards && data.cards.length > 0) {
                // Append new cards and reset to first new one
                var oldLen = CARDS.length;
                CARDS = CARDS.concat(data.cards);
                currentIndex = oldLen;
                deckEmpty.style.display = 'none';
                actions.style.display = '';
                renderCard();
            } else {
                btn.textContent = 'No more ideas right now';
            }
        })
        .catch(function() {
            btn.disabled = false;
            btn.textContent = 'Load More Ideas';
        });
    });

    renderCard();
})();
</script>
{% endblock %}
